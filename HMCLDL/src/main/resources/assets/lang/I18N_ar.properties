fatal.create_hmcldl_current_directory_failure=لا يستطيع HMCLDL إنشاء مجلد HMCLDL (%s). يُرجى نقل HMCLDL إلى موقع آخر وإعادة تشغيله.
fatal.javafx.incomplete=بيئة JavaFX غير مكتملة.\n\
   يُرجى محاولة استبدال Java أو إعادة تثبيت OpenJFX.
fatal.javafx.missing=بيئة JavaFX مفقودة. يُرجى فتح HMCLDL باستخدام Java الذي يتضمن OpenJFX.
fatal.config_change_owner_root=أنت تستخدم حساب الجذر لفتح HMCLDL. قد يمنعك ذلك من فتح HMCLDL بحساب آخر في المستقبل.\n\
   هل تريد المتابعة؟
fatal.config_in_temp_dir=أنت تفتح HMCLDL في مجلد مؤقت. قد تُفقد إعداداتك وبيانات اللعبة.\n\
   يُنصح بنقل HMCLDL إلى موقع آخر وإعادة تشغيله.\n\
   هل تريد المتابعة؟
fatal.config_loading_failure=لا يمكن تحميل ملفات الإعدادات.\n\
   يُرجى التأكد من أن HMCLDL يملك صلاحيات القراءة والكتابة على "%s" والملفات الموجودة فيه.\n\
   لمستخدمي macOS، جرّب وضع HMCLDL في موقع بصلاحيات غير "سطح المكتب" و"التنزيلات" و"المستندات" وأعد المحاولة.
fatal.config_loading_failure.unix=لا يستطيع HMCLDL تحميل ملف الإعدادات لأنه أُنشئ بواسطة المستخدم "%1$s".\n\
   يُرجى فتح HMCLDL كمستخدم جذر (غير موصى به)، أو تنفيذ الأمر التالي في الطرفية لتغيير ملكية ملف الإعدادات إلى المستخدم الحالي:\n%2$s
fatal.config_unsupported_version=ملف الإعدادات الحالي أُنشئ بواسطة إصدار أحدث من HMCLDL، ولا يستطيع هذا الإصدار من HMCLDL تحميله بشكل صحيح.\n\
   يُرجى تحديث HMCLDL وإعادة تشغيله.\n\
   قبل تحديث المشغّل، لن يتم حفظ أي إعدادات تقوم بتعديلها.
fatal.mac_app_translocation=تم عزل HMCLDL في مجلد مؤقت بواسطة نظام التشغيل بسبب آليات أمان macOS.\n\
   يُرجى نقل HMCLDL إلى مجلد آخر قبل محاولة الفتح. وإلا، قد تُفقد إعداداتك وبيانات اللعبة بعد إعادة التشغيل.\n\
   هل تريد المتابعة؟
fatal.deprecated_java_version=سيتطلب HMCLDL Java 17 أو أحدث للتشغيل في المستقبل، لكنه سيستمر في دعم تشغيل الألعاب باستخدام Java 6~16.\n\
\n\
يُنصح بتثبيت أحدث إصدار من Java لضمان عمل HMCLDL بشكل صحيح.\n\
\n\
يمكنك الاحتفاظ بإصدار Java القديم. يستطيع HMCLDL التعرف على إصدارات Java المتعددة وإدارتها وسيختار تلقائياً Java المناسب بناءً على إصدار اللعبة.
fatal.deprecated_java_version.download_link=تنزيل Java %d
fatal.samba=إذا فتحت HMCLDL من محرك أقراص شبكة Samba، قد لا تعمل بعض الميزات. يُرجى محاولة تحديث Java أو نقل المشغّل إلى مجلد آخر.
fatal.illegal_char=مسار المستخدم الخاص بك يحتوي على حرف غير مسموح به "=".
fatal.unsupported_platform=لا يدعم Minecraft منصتك الحالية بشكل كامل بعد، لذا قد تواجه ميزات مفقودة أو عدم القدرة على تشغيل اللعبة.\n\
   \n\
   إذا لم تتمكن من تشغيل Minecraft 1.17 أو أحدث، يمكنك محاولة تغيير "المُصيِّر" إلى "Mesa LLVMpipe" في "الإعدادات العامة/الخاصة بالنسخة ← الإعدادات المتقدمة" لاستخدام معالجة المعالج المركزي لتوافق أفضل.
fatal.unsupported_platform.loongarch=وفّر HMCLDL دعماً لمنصة Loongson.\n\
   إذا واجهت مشاكل أثناء اللعب، يمكنك زيارة https://github.com/cubestudio-dev/HMCLDL للحصول على مساعدة.
fatal.unsupported_platform.windows_arm64=وفّر HMCLDL دعماً أصلياً لمنصة Windows on Arm. إذا واجهت مشاكل أثناء اللعب، يُرجى محاولة تشغيل اللعبة بـ Java المبني على معمارية x86.\n\
   \n\
   إذا كنت تستخدم منصة <b>Qualcomm</b>، قد تحتاج إلى تثبيت <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">حزمة توافق OpenGL</a> قبل اللعب.\n\
   انقر على الرابط للانتقال إلى Microsoft Store وتثبيت حزمة التوافق.
