exception.access_denied=لا يستطيع HMCLDL الوصول إلى الملف "%s". قد يكون مقفلاً بواسطة عملية أخرى.\n\
   \n\
   لمستخدمي Windows، يمكنك فتح "مراقب الموارد" للتحقق مما إذا كانت عملية أخرى تستخدمه حالياً. إذا كان الأمر كذلك، يمكنك المحاولة مجدداً بعد إنهاء تلك العملية.\n\
   إذا لم يكن كذلك، يُرجى التحقق من أن حساب المستخدم الخاص بك يملك الصلاحيات الكافية للوصول إليه.
exception.artifact_malformed=لا يمكن التحقق من سلامة الملفات المنزّلة.
exception.ssl_handshake=فشل إنشاء اتصال SSL لأن شهادة SSL مفقودة من تثبيت Java الحالي. يمكنك محاولة فتح HMCLDL بتثبيت Java آخر والمحاولة مجدداً.
exception.dns.pollution=فشل إنشاء اتصال SSL. قد يكون تحليل DNS غير صحيح. يُرجى تغيير خادم DNS الخاص بك أو استخدام خدمة وكيل.

