fatal.create_hmcldl_current_directory_failure=HMCLDL не може створити каталог HMCLDL (%s). Перемістіть HMCLDL в інше місце та відкрийте його знову.
fatal.javafx.incomplete=Середовище JavaFX неповне. \n\
   Спробуйте замінити вашу Java або перевстановити OpenJFX.
fatal.javafx.missing=Відсутнє середовище JavaFX. Відкрийте HMCLDL за допомогою Java, яка включає OpenJFX.
fatal.config_change_owner_root=Ви використовуєте обліковий запис root для відкриття HMCLDLа. Це може завадити вам відкрити HMCLDL іншим обліковим записом у майбутньому. \n\
   Все одно продовжити?
fatal.config_in_temp_dir=Ви відкриваєте HMCLDL у тимчасовому каталозі. Ваші налаштування та ігрові дані можуть бути втрачені. \n\
   Рекомендується перемістити HMCLDL в інше місце та відкрити його знову. \n\
   Все одно продовжити?
fatal.config_loading_failure=Не вдається завантажити файли конфігурації.\n\
   Переконайтеся, що HMCLDL має права на читання та запис до "%s" та файлів у ньому.\n\
   Для macOS спробуйте помістити HMCLDL кудись із дозволами, відмінними від "Робочий стіл", "Завантаження" та "Документи", і спробуйте знову.
fatal.config_loading_failure.unix=HMCLDL не зміг завантажити файл конфігурації, оскільки він був створений користувачем "%1$s".\n\
   Відкрийте HMCLDL як користувач root (не рекомендується) або виконайте наступну команду в терміналі, щоб змінити власника файлу конфігурації на поточного користувача:\n%2$s
fatal.config_unsupported_version=Поточний файл конфігурації був створений новішою версією HMCLDL, і ця версія HMCLDL не може завантажити його належним чином.\n\
  Будь ласка, оновіть та перезапустіть HMCLDL.\n\
  До оновлення лаунчера будь-які змінені вами налаштування не будуть збережені.
fatal.mac_app_translocation=HMCLDL ізольовано до тимчасового каталогу ОС через механізми безпеки macOS.\n\
   Перемістіть HMCLDL в інший каталог перед спробою відкриття. Інакше ваші налаштування та ігрові дані можуть бути втрачені після перезавантаження.\n\
   Все одно продовжити?
fatal.deprecated_java_version=У майбутньому HMCLDL потребуватиме Java 17 або новішої версії для роботи, але все ще підтримуватиме запуск ігор на Java 6~16.\n\nРекомендується встановити останню версію Java, щоб гарантувати належну роботу HMCLDL.\n\nВи можете продовжувати зберігати стару версію Java. HMCLDL може розпізнавати та керувати декількома версіями Java і автоматично вибере відповідну Java для вас на основі версії гри.
fatal.deprecated_java_version.download_link=Завантажити Java %d
fatal.samba=Якщо ви відкрили HMCLDL з мережевого диска Samba, деякі функції можуть не працювати. Спробуйте оновити вашу Java або перемістити лаунчер в інший каталог.
fatal.illegal_char=Ваш шлях користувача містить недопустимий символ "=".
fatal.unsupported_platform=Minecraft ще не повністю підтримується на вашій платформі, тому можливі відсутні функції або навіть неможливість запуску гри.\n\
   \n\
   Якщо ви не можете запустити Minecraft версії 1.17 і новіші, спробуйте змінити «Рендерер» на «Mesa LLVMpipe» у розділі «Глобальні/налаштування екземпляра → Розширені налаштування», щоб використовувати рендеринг через CPU для кращої сумісності.
fatal.unsupported_platform.loongarch=HMCLDL надав підтримку платформи Loongson.\n\
   Якщо у вас виникли проблеми під час гри, ви можете відвідати https://github.com/cubestudio-dev/HMCLDL для отримання допомоги.
fatal.unsupported_platform.windows_arm64=HMCLDL надав нативну підтримку платформи Windows on Arm. Якщо у вас виникли проблеми під час гри, спробуйте запустити гру з Java на основі архітектури x86.\n\
   Якщо ви використовуєте платформу <b>Qualcomm</b>, вам може знадобитися встановити <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">Пакет сумісності OpenGL</a> перед грою.\n\
   Натисніть посилання, щоб перейти до Microsoft Store та встановити пакет сумісності.
fatal.wine_warning=HMCLDL працює під керуванням Wine або одного з його дистрибутивів.\nЯк кросплатформний додаток, HMCLDL найкраще працює нативно на вашій хост-ОС.\nНатисніть "ОК", щоб продовжити, але зверніть увагу, що можуть виникнути деякі проблеми.

