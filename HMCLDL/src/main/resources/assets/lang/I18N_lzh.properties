fatal.create_hmcldl_current_directory_failure=HMCLDL 不能立其案夾 (%s)，宜稍遷而再啟之。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.javafx.incomplete=JavaFX 損。宜更爪哇，抑復置 OpenJFX。
fatal.javafx.missing=JavaFX 闕。君須行 HMCLDL 於爪哇之俻 OpenJFX 者。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.config_change_owner_root=君方啟 HMCLDL 以根戶簿，是則他戶簿或不能啟之。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。\n猶啟諸？
fatal.config_in_temp_dir=君啟 HMCLDL 於暫夾也。君之置設與戲事或佚焉。抑遷而再啟。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。\n猶啟諸？
fatal.config_loading_failure=HMCLDL 不能閲置設之案。\n宜驗 HMCLDL 訪案夾「%s」與其諸案之權。\n林檎之下，或宜遷 HMCLDL 於「桌面」「引」「文案」外有權之處，然後再試之。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.config_loading_failure.unix=HMCLDL 不能閲置設之案，以之見立於戶簿「%1$s」。\n君可啟 HMCLDL 以根戶簿 (弗宜)，抑行令以遷案於君之戶簿：\n%2$s\n君可求助于 https://github.com/cubestudio-dev/HMCLDL。
# fatal.config_unsupported_version=
fatal.mac_app_translocation=林檎爲求安，乃遷 HMCLDL 与暫夾中。\n宜遷 HMCLDL 於他夾，然後啟之。否，則置設與戲事或佚。\n君可以求助於 https://github.com/cubestudio-dev/HMCLDL。\n猶啟諸？
fatal.deprecated_java_version=HMCLDL 將須爪哇十七並後者，然猶可啟戲以爪哇六至十六也。宜置至新之爪哇，以保 HMCLDL 之行。\n爪哇之舊者猶可留。HMCLDL 識理諸爪哇，以行適者以戲事之版也。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.deprecated_java_version.download_link=引爪哇 %d
fatal.samba=誠行於案夾之同享以 Samba 者，啟者或不能行。宜新爪哇，抑遷於自案。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.illegal_char=君之案夾名有諱文「=」，是以外載之戶簿、離綫戶簿之更外觀者弗行。\n君可求助於 https://github.com/cubestudio-dev/HMCLDL。
fatal.unsupported_platform=礦藝未盡適君之算機，是以戲事或損，至於不能啟。\n\
  礦藝一點一七以晉之不能啟，或於「(全例/例殊) 戲設 → 進階置設 → 勘誤置設」改「繪製之器」以「Mesa LLVMpipe」，或能兼之。\n君可求助於右上之鈕。
fatal.unsupported_platform.loongarch=HMCLDL 既適龍芯。\n凡有謬，遽求助於右上之鈕。
fatal.unsupported_platform.windows_arm64=HMCLDL 既適 ARM 之視窗。誠有謬，宜啟以 x86 之爪哇。\n誠用<b>栝柑</b>，或須置<a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">開圖庫兼囊</a>，而後可戯。擊鏈以置之於微軟貨舍。\n君可求助於右上之鈕。
