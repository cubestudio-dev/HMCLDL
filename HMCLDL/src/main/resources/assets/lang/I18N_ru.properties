fatal.create_hmcl_current_directory_failure=Лаунчер не может создать папку HMCLDL (%s). Пожалуйста, переместите лаунчер в другое место и откройте его снова.
fatal.javafx.incomplete=Среда JavaFX является неполной.\n\
  Попробуйте заменить Java или переустановить OpenJFX.
fatal.javafx.missing=Отсутствует среда JavaFX.\nЗапустите HMCLDL с помощью Java, которая включает OpenJFX.
fatal.config_change_owner_root=Вы запускаете HMCLDL от имени root. Из-за этого в будущем может не получиться открыть HMCLDL под другим пользователем.\nВсё равно продолжить?
fatal.config_in_temp_dir=Вы открываете лаунчер во временной папке. Ваши настройки и игровые данные могут быть потеряны.\n\
  Рекомендуется перенести HMCLDL в другое место и открыть его заново.\n\
  Вы все еще хотите продолжить?
fatal.config_loading_failure=Не удалось прочитать файлы конфигурации.\nУбедитесь, что у HMCLDL есть права на чтение и запись в «%s» и файлы внутри.\nНа macOS попробуйте переместить HMCLDL в папку, отличную от «Рабочий стол», «Загрузки» и «Документы», и повторите попытку.
fatal.config_loading_failure.unix=HMCLDL не смог прочитать файл конфигурации, так как он был создан пользователем «%1$s».\nОткройте HMCLDL от имени пользователя root (не рекомендуется) или выполните следующую команду в терминале, чтобы изменить право собственности на конфигурационный файл для текущего пользователя:\n%2$s
fatal.config_unsupported_version=Текущий файл конфигурации создан более новой версией HMCLDL, и эта версия не может корректно его загрузить.\nОбновите HMCLDL и перезапустите его.\nДо обновления лаунчера изменённые настройки не будут сохраняться.
fatal.mac_app_translocation=HMCLDL изолирован ОС во временной папке из-за механизмов безопасности macOS.\nПереместите HMCLDL в другую папку, прежде чем пытаться открыть. В противном случае ваши настройки и игровые данные могут быть потеряны после перезапуска.\nВы все еще хотите продолжить?
fatal.deprecated_java_version=В будущем для работы HMCLDL потребуется Java 17 или более поздняя версия, однако запуск игр будет поддерживаться и на Java 6~16.\n\
\n\
Рекомендуется установить последнюю версию Java, чтобы обеспечить правильную работу HMCLDL.\n\
\n\
Вы можете продолжать использовать старую версию Java. HMCLDL может распознавать и управлять несколькими версиями Java и автоматически выбирать подходящую Java в зависимости от версии игры.
fatal.deprecated_java_version.download_link=Скачать Java %d
fatal.samba=Если вы пытаетесь открыть лаунчер в общей папке Samba, он может не работать, попробуйте обновить Java или запустить лаунчер из локальной папки.
fatal.illegal_char=Путь к рабочей папке содержит недопустимый символ «=».
fatal.unsupported_platform=Minecraft еще не полностью поддерживается на вашей платформе, поэтому вы можете столкнуться с отсутствием функций или даже не сможете запустить игру.\n\nЕсли вы не можете запустить Minecraft версии 1.17 и новее, попробуйте переключить «Рендерер» на «Mesa LLVMpipe» или «Mesa Lavapipe» в разделе «Глобальные настройки / Раздельные настройки для сборки → Настройки графики», чтобы использовать рендеринг через CPU для лучшей совместимости.
fatal.unsupported_platform.loongarch=HMCLDL поддерживает платформу Loongson.\nЕсли у вас возникнут проблемы во время игры, обратитесь за помощью на https://docs.HMCLDL.net/groups.html.
fatal.unsupported_platform.windows_arm64=HMCLDL нативно поддерживает Windows на Arm. Если у вас возникли проблемы во время игры, попробуйте запустить игру с Java для архитектуры x86.\n\nЕсли вы используете платформу <b>Qualcomm</b>, вам может потребоваться установить <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">пакет совместимости OpenGL</a> перед началом игры.\nЩелкните ссылку, чтобы перейти в Microsoft Store и установить пакет совместимости.
fatal.wine_warning=HMCLDL запущен в Wine или одном из его дистрибутивов.\nHMCL — кроссплатформенное приложение, и лучше всего он работает нативно в вашей ОС.\nНажмите «ОК», чтобы продолжить, но учтите, что возможны проблемы.

