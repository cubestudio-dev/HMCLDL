exception.access_denied=无法访问文件“%s”。HMCLDL 没有对该文件的访问权限，或者该文件已被其他程序打开。\n\
  请你检查当前操作系统账户是否能访问该文件，比如非管理员用户可能无法访问其他账户的个人文件夹内的文件。\n\
  对于 Windows 用户，你还可以尝试通过资源监视器查看是否有程序占用了该文件。如果是，请关闭占用该文件的程序，或者重启电脑再试。\n\
  如遇到问题，你可以点击右上角帮助按钮进行求助。
exception.artifact_malformed=下载的文件无法通过校验。\n你可以点击右上角帮助按钮进行求助。
exception.ssl_handshake=无法建立 SSL 连接。当前 Java 缺少相关的 SSL 证书。你可以尝试使用其他 Java 启动 HMCLDL 再试。\n你可以点击右上角帮助按钮进行求助。
exception.dns.pollution=无法建立 SSL 连接。可能是 DNS 解析有误。请尝试更换 DNS 服务器或使用代理服务。\n你可以点击右上角帮助按钮进行求助。

extension.png=图片文件

fatal.create_hmcldl_current_directory_failure=HMCLDL 无法创建 HMCLDL 文件夹 (%s)，请将 HMCLDL 移动至其他位置再启动。\n如遇到问题，你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.javafx.incomplete=JavaFX 运行环境不完整。请尝试更换你的 Java 或者重新安装 OpenJFX。
fatal.javafx.missing=缺少 JavaFX 运行环境。请使用包含 OpenJFX 的 Java 运行环境启动 HMCLDL。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.config_change_owner_root=你正在使用 root 账户启动 HMCLDL，这可能导致你未来无法正常使用其他账户正常启动 HMCLDL。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。\n是否继续启动？
fatal.config_in_temp_dir=你正在临时文件夹中启动 HMCLDL，你的设置和游戏数据可能会丢失。建议将 HMCLDL 移动至其他位置再启动。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。\n是否继续启动？
fatal.config_loading_failure=HMCLDL 无法加载配置文件。\n请确保 HMCLDL 对“%s”文件夹及该文件夹下的文件拥有读写权限。\n对于 macOS，尝试将 HMCLDL 放在除“桌面”“下载”“文稿”之外的有权限的地方再试。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.config_loading_failure.unix=HMCLDL 无法加载配置文件，因为配置文件是由用户“%1$s”创建的。\n请使用 root 账户启动 HMCLDL (不推荐)，或在终端中执行以下命令将配置文件的所有权变更为当前用户：\n%2$s\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.config_unsupported_version=当前配置文件是由更高版本的 HMCLDL 创建的，当前版本的 HMCLDL 无法正常加载。请更新并重启 HMCLDL。\n在更新启动器之前，你修改的所有设置都不会被保存。\n如果遇到问题，你可以点击右上角帮助按钮进行求助。
fatal.mac_app_translocation=由于 macOS 的安全机制，HMCLDL 被系统隔离至临时文件夹中。\n请将 HMCLDL 移动到其他文件夹后再尝试启动，否则你的设置和游戏数据可能会在重启后丢失。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。\n是否继续启动？
fatal.deprecated_java_version=HMCLDL 未来需要 Java 17 或更高版本才能运行，但依然支持使用 Java 6~16 启动游戏。建议安装最新版本的 Java 以确保 HMCLDL 能正常工作。\n你可以继续保留旧版本 Java。HMCLDL 能够识别与管理多个 Java，并会自动根据游戏版本为你选择合适的 Java。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.deprecated_java_version.download_link=下载 Java %d
fatal.samba=如果你正在通过 Samba 共享的文件夹中运行 HMCLDL，启动器可能无法正常工作。请尝试更新你的 Java 或在本地文件夹内运行 HMCLDL。\n你可以访问 https://github.com/cubestudio-dev/HMCLDL 页面寻求帮助。
fatal.illegal_char=由于你的运行路径中存在非法字符“=”。
fatal.unsupported_platform=Minecraft 尚未对你的平台提供完善支持，所以可能影响游戏体验或无法启动游戏。\n\
  若无法启动 Minecraft 1.17 及更高版本，可以尝试在“(全局/实例特定) 游戏设置 → 图形设置”中将“渲染器”切换为“Mesa LLVMpipe” / “Mesa Lavapipe”，以获得更好的兼容性。\n\
  如遇到问题，你可以点击右上角帮助按钮进行求助。
fatal.unsupported_platform.loongarch=HMCLDL 已为龙芯提供支持。\n如果遇到问题，你可以点击右上角帮助按钮进行求助。
fatal.unsupported_platform.windows_arm64=HMCLDL 已为 Windows on Arm 平台提供原生支持。如果你在游戏中遇到问题，请尝试使用 x86 架构的 Java 启动游戏。\n如果你正在使用 <b>高通</b> 平台，你可能需要安装 <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL 兼容包</a> 后才能进行游戏。点击链接前往 Microsoft Store 安装兼容包。\n如遇到问题，你可以点击右上角帮助按钮进行求助。
# When translating the following string into non-Latin languages, please retain the English translation
fatal.wine_warning=HMCLDL is running under Wine or one of its distributions.\nAs a cross-platform application, HMCLDL is best experienced natively on your host OS.\nPress "OK" to continue, but please note that some issues may arise.\n\n您目前正在使用 Wine 或其发行版运行 HMCLDL。\nHMCLDL 是跨平台的，我们建议您直接在宿主系统上运行。\n按下“确定”以继续，但请注意，此操作可能会引发一些问题。

