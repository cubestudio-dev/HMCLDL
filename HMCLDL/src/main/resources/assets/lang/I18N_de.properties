fatal.create_hmcldl_current_directory_failure=HMCLDL kann das HMCLDL-Verzeichnis (%s) nicht erstellen. Bitte verschieben Sie HMCLDL an einen anderen Speicherort und öffnen Sie es erneut.
fatal.javafx.incomplete=Die JavaFX-Umgebung ist unvollständig.\n\
   Bitte versuchen Sie, Ihr Java zu ersetzen oder OpenJFX neu zu installieren.
fatal.javafx.missing=Fehlende JavaFX-Umgebung. Bitte öffnen Sie den HMCLDL mit Java, welches OpenJFX enthält.
fatal.config_change_owner_root=Sie verwenden das Root-Konto, um den HMCLDL zu öffnen. Dies könnte Sie daran hindern, HMCLDL in Zukunft mit einem anderen Konto zu öffnen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.config_in_temp_dir=Sie öffnen den HMCLDL in einem temporären Verzeichnis. Ihre Einstellungen und Spieldaten könnten verloren gehen.\n\
   Es wird empfohlen, HMCLDL an einen anderen Ort zu verschieben und erneut zu öffnen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.config_loading_failure=Konfigurationsdateien können nicht geladen werden.\n\
   Bitte stellen Sie sicher, dass der HMCLDL Lese- und Schreibzugriff auf "%s" und die darin enthaltenen Dateien hat.\n\
   Versuchen Sie unter macOS, HMCLDL an einen Ort mit anderen Berechtigungen als "Schreibtisch", "Downloads" und "Dokumente" zu legen und versuchen Sie es erneut.
fatal.config_loading_failure.unix=HMCLDL konnte die Konfigurationsdatei nicht laden, da sie vom Benutzer "%1$s" erstellt wurde.\n\
   Bitte öffnen Sie HMCLDL als Root-Benutzer (nicht empfohlen) oder führen Sie den folgenden Befehl im Terminal aus, um den Besitz der Konfigurationsdatei auf den aktuellen Benutzer zu übertragen:\n%2$s
fatal.config_unsupported_version=Die aktuelle Konfigurationsdatei wurde von einer neueren Version des HMCLDLs erstellt, und diese Version von HMCLDL kann sie nicht richtig laden.\n\
   Bitte aktualisieren Sie HMCLDL und starten Sie es neu.\n\
   Vor dem Aktualisieren des Launchers werden keine von Ihnen geänderten Einstellungen gespeichert.
fatal.mac_app_translocation=HMCLDL wurde aufgrund von macOS-Sicherheitsmechanismen vom Betriebssystem in ein temporäres Verzeichnis isoliert.\n\
   Bitte verschieben Sie HMCLDL in ein anderes Verzeichnis, bevor Sie versuchen, es zu öffnen. Andernfalls könnten Ihre Einstellungen und Spieldaten nach einem Neustart verloren gehen.\n\
   Möchten Sie trotzdem fortfahren?
fatal.deprecated_java_version=HMCLDL wird in Zukunft Java 17 oder neuer benötigen, um zu laufen, wird aber weiterhin das Starten von Spielen mit Java 6~16 unterstützen.\n\
\n\
Es wird empfohlen, die neueste Java-Version zu installieren, um sicherzustellen, dass HMCLDL ordnungsgemäß funktioniert.\n\
\n\
Sie können die alte Java-Version weiterhin behalten. HMCLDL kann mehrere Java-Versionen erkennen und verwalten und wählt basierend auf der Spielversion automatisch das entsprechende Java für Sie aus.
fatal.deprecated_java_version.download_link=Java %d herunterladen
fatal.samba=Wenn Sie den HMCLDL von einem Samba-Netzlaufwerk geöffnet haben, funktionieren einige Funktionen möglicherweise nicht. Bitte versuchen Sie, Ihr Java zu aktualisieren oder den Launcher in ein anderes Verzeichnis zu verschieben.
fatal.illegal_char=Ihr Arbeitsverzeichnis enthält ein ungültiges Zeichen "=".
fatal.unsupported_platform=Minecraft wird auf Ihrer Plattform noch nicht vollständig unterstützt, daher fehlen möglicherweise Funktionen oder Sie können das Spiel überhaupt nicht starten.\n\
   \n\
   Wenn Sie Minecraft 1.17 und neuer nicht starten können, können Sie versuchen, den "Renderer" unter "Allgemeine/Instanzspezifische Einstellungen → Grafikeinstellungen" auf "Mesa LLVMpipe" oder "Mesa Lavapipe" umzustellen, um CPU-Rendering für bessere Kompatibilität zu verwenden.
fatal.unsupported_platform.loongarch=Der HMCLDL bietet nun Unterstützung für die Loongson-Plattform.\n\
   Wenn beim Spielen Probleme auftreten, können Sie https://github.com/cubestudio-dev/HMCLDL für Hilfe besuchen.
fatal.unsupported_platform.windows_arm64=Der HMCLDL bietet native Unterstützung für die Windows-on-Arm-Plattform. Wenn beim Spielen Probleme auftreten, versuchen Sie bitte, das Spiel mit Java basierend auf der x86-Architektur zu starten.\n\
   \n\
   Wenn Sie die <b>Qualcomm</b>-Plattform verwenden, müssen Sie möglicherweise das <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL-Kompatibilitätspaket</a> installieren, bevor Sie Spiele spielen.\n\
   Klicken Sie auf den Link, um zum Microsoft Store zu navigieren und das Kompatibilitätspaket zu installieren.
# When translating the following string into non-Latin languages, please retain the English translation
fatal.wine_warning=HMCLDL läuft unter Wine oder einer seiner Distributionen.\nAls plattformübergreifende Anwendung wird HMCLDL am besten nativ auf Ihrem Host-Betriebssystem ausgeführt.\nKlicken Sie auf "OK", um fortzufahren, aber beachten Sie bitte, dass einige Probleme auftreten können.

