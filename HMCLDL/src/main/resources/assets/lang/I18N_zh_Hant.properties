exception.access_denied=無法存取檔案「%s」。因為 HMCLDL 沒有對該檔案的訪問權限，或者該檔案已被其他程式開啟。\n\
  請你檢查目前作業系統帳戶是否能訪存取檔案，比如非管理員使用者可能不能訪問其他帳戶的個人目錄內的檔案。\n\
  對於 Windows 使用者，你還可以嘗試透過資源監視器查看是否有程式占用了該檔案。如果是，你可以關閉占用此檔案的程式，或者重啟電腦再試。
exception.artifact_malformed=下載的檔案正確，但無法透過校驗。
exception.ssl_handshake=無法建立 SSL 連線。目前 Java 缺少相關的 SSL 證書。你可以嘗試使用其他 Java 或關閉網路代理開啟 HMCLDL 再試。
exception.dns.pollution=無法建立 SSL 連線。可能是 DNS 解析有誤。請嘗試更換 DNS 伺服器或使用代理服務。

extension.png=圖片檔案

fatal.create_hmcldl_current_directory_failure=HMCLDL 無法建立 HMCLDL 資料夾 (%s)，請將 HMCLDL 移動至其他位置再開啟。
fatal.javafx.incomplete=JavaFX 執行環境不完整。請嘗試更換你的 Java 或者重新安裝 OpenJFX。
fatal.javafx.missing=缺少 JavaFX 執行環境。請使用包含 OpenJFX 的 Java 執行環境開啟 HMCLDL。
fatal.config_change_owner_root=你正在使用 root 帳戶開啟 HMCLDL，這可能導致你未來無法使用其他帳戶正常開啟 HMCLDL。\n是否繼續開啟？
fatal.config_in_temp_dir=你正在暫存目錄中開啟 HMCLDL，你的設定和遊戲資料可能會遺失。建議將 HMCLDL 移動至其他位置再開啟。\n是否繼續開啟？
fatal.config_loading_failure=HMCLDL 無法載入設定檔案。\n請確保 HMCLDL 對「%s」目錄及該目錄下的檔案擁有讀寫權限。
fatal.config_loading_failure.unix=HMCLDL 無法載入設定檔案，因為設定檔案是由使用者「%1$s」建立的。\n請使用 root 帳戶開啟 HMCLDL (不推薦)，或在終端中執行以下指令將設定檔案的所有權變更為目前使用者：\n%2$s
fatal.config_unsupported_version=目前設定檔案是由更高版本的 HMCLDL 建立的，目前版本的 HMCLDL 無法正常載入。請更新並重新啟動 HMCLDL。\n在更新啟動器之前，你所做的所有設定更改都不會被儲存。
fatal.mac_app_translocation=由於 macOS 的安全機制，HMCLDL 被系統隔離至暫存目錄中。\n請將 HMCLDL 移動到其他目錄後再嘗試開啟，否則你的設定和遊戲資料可能會在重啟後遺失。\n是否繼續開啟？
fatal.deprecated_java_version=HMCLDL 未來需要 Java 17 或更高版本才能執行，但依然支援使用 Java 6~16 啟動遊戲。建議安裝最新版本的 Java 以確保 HMCLDL 正常執行。\n你可以繼續保留舊版本 Java。HMCLDL 能夠識別與管理多個 Java，並會自動根據遊戲版本為你選取合適的 Java。
fatal.deprecated_java_version.download_link=下載 Java %d
fatal.samba=如果您正在透過 Samba 共亯的目錄中開啟 HMCLDL，啟動器可能無法正常工作，請嘗試更新您的 Java 或在本機目錄內開啟 HMCLDL。
fatal.illegal_char=由於您的執行路徑中存在無效字元『=』，您將無法使用外部登入帳戶以及離線登入更換外觀功能。
fatal.unsupported_platform=Minecraft 尚未對您的平臺提供完善支援，所以可能影響遊戲體驗或無法啟動遊戲。\n\
  若無法啟動 Minecraft 1.17 及更高版本，可以嘗試在「(全域/實例特定) 遊戲設定 → 圖形設定」中將「繪製器」切換為「Mesa LLVMpipe」/「Mesa Lavapipe」，以獲得更好的相容性。
fatal.unsupported_platform.loongarch=HMCLDL 已為龍芯提供支援。\n如果遇到問題，你可以點擊右上角幫助按鈕進行求助。
fatal.unsupported_platform.windows_arm64=HMCLDL 已為 Windows on Arm 平臺提供原生支援。如果你在遊戲中遭遇問題，請嘗試使用 x86 架構的 Java 啟動遊戲。\n\n如果你正在使用<b>高通</b>平臺，你可能需要安裝 <a href="ms-windows-store://pdp/?productid=9NQPSL29BFFF">OpenGL 相容包</a>後才能進行遊戲。點擊連結前往 Microsoft Store 安裝相容包。
# When translating the following string into non-Latin languages, please retain the English translation
fatal.wine_warning=HMCLDL is running under Wine or one of its distributions.\nAs a cross-platform application, HMCLDL is best experienced natively on your host OS.\nPress "OK" to continue, but please note that some issues may arise.\n\n您目前正在使用 Wine 或其衍生版本執行 HMCLDL。\nHMCLDL 是跨平臺的，我們建議您直接在主機系統上執行。\n按下「確定」以繼續，但請注意，此操作可能會引發一些問題。

